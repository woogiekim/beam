[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beam"
version = "0.1.0"
description = "Terminal UI deployment tool for SSH/SFTP file synchronization"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=3.4.0",
    "textual>=0.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
beam = "beam.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
